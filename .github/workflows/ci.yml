name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: GlyphCore tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: Core
        run: swift test

  macos:
    name: Build app and test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: GlyphCore tests on macOS
        working-directory: Core
        run: swift test

      - name: Build (Debug, App Store configuration)
        run: |
          set -o pipefail
          xcodebuild -project Typecase.xcodeproj -scheme Typecase -configuration Debug \
            -destination 'platform=macOS' build 2>&1 | tee build-debug.log | tail -n 40

      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Typecase.xcodeproj -scheme Typecase -configuration Release \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build 2>&1 \
            | tee build-release.log | tail -n 20

      - name: Build (Release-Direct, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Typecase.xcodeproj -scheme "Typecase (Direct)" -configuration Release-Direct \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build 2>&1 \
            | tee build-direct.log | tail -n 20

      - name: Compiler errors and warnings
        if: always()
        run: |
          for f in build-debug.log build-release.log build-direct.log; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            grep -E "error:|warning:" "$f" | grep -v "appintentsmetadataprocessor" | sort -u | head -n 80 || true
          done
